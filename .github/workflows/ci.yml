# ci.yml - the collector tests, the push API tests and the app build, on every pull request and every push to main.
# Dependabot's weekly pull requests (see dependabot.yml) go through the same gate, so a dependency update that breaks
# the push API or the app fails here before anyone merges it. Actions are pinned to commit SHAs (developer §8.3).
# Checked by aiOS/Evals/check_workflow.py in the vault.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip check
      - name: collector logic, no network
        run: python tests/collector_test.py

  push-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-push.txt
      - run: pip install -r requirements-push.txt
      - run: pip install httpx==0.28.1
      - run: pip check
      - name: push API routes against a throwaway store
        run: python -W ignore -m unittest tests.test_push_server

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: audit (runtime dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
