# secrets-scan.yml - the full-history secret scan on its own (developer §8.1 rule 3, assets/gate.yml `secrets` job).
# Drop into .github/workflows/ of a repo whose CI has no real secret scan. The pre-commit gitleaks hook scans only
# staged changes, so `pre-commit run --all-files` in CI reports "0 commits scanned" and passes (shown 2026-10-23).
# Checked by aiOS/Evals/check_workflow.py. gitleaks 8.30.1, binary pinned by sha256. Bump on purpose, never `latest`.
name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the full history
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --verbose
